# Default values for commandcentral.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
strategy: Recreate

image:
  repository: store/softwareag/commandcentral-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 10.5

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port:
    cce:
      http: 8090
      https: 8091
    spm:
      http: 8992
      https: 8993

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: example.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - example.org

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector:
  server-role-web: "true"

tolerations: []

affinity: {}

env: {}

secrets:
  admin:
    username: Administrator
    password: manage
  repo:
    username: 
    password: 

volumes:
  cce:
    conf: {}
      # hostPath:
      #   path: /home/domains/example.org/sag/profiles/CCE/configuration
      #   type: DirectoryOrCreate
    data: {}
      # hostPath:
      #   path: /home/domains/example.org/sag/profiles/CCE/data
      #   type: DirectoryOrCreate
  spm:
    conf: {}
      # hostPath:
      #   path: /home/domains/example.org/sag/profiles/SPM/configuration
      #   type: DirectoryOrCreate
    data: {}
      # hostPath:
      #   path: /home/domains/example.org/sag/profiles/SPM/data
      #   type: DirectoryOrCreate
