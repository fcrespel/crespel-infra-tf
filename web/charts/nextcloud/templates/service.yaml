apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.notify_push.enabled }}
    - port: {{ .Values.notify_push.port }}
      targetPort: notify-push
      protocol: TCP
      name: notify-push
    {{- end }}
  selector:
    {{- include "nextcloud.selectorLabels" . | nindent 4 }}
