fullnameOverride: karaplan

image:
  tag: master-20240802-1613-0850e0f

podSecurityContext:
  runAsUser: 1003
  runAsGroup: 1004

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/default-backend: default-backend
  hosts:
    - host: "karaplan.crespel.me"
      paths:
        - path: "/"
          pathType: ImplementationSpecific
  tls:
    - secretName: karaplan-tls
      hosts:
        - "karaplan.crespel.me"

env:
  JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1024m -Xverify:none -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/karaplan?useSSL=false&serverTimezone=Europe/Paris"
