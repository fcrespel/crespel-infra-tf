fullnameOverride: karaplan

image:
  tag:  master-20251109-1504-281559f

podSecurityContext:
  runAsUser: 1003
  runAsGroup: 1004

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/default-backend: default-backend
  hosts:
    - host: "karaplan.crespel.me"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: karaplan-tls
      hosts:
        - "karaplan.crespel.me"

env:
  JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1024m -Xverify:none -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  SPRING_DATASOURCE_URL: "jdbc:mariadb://mysql:3306/karaplan?useSSL=false&serverTimezone=Europe/Paris"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://${HOST_IP}:4318"
  OTEL_INSTRUMENTATION_COMMON_ENDUSER_ID_ENABLED: "true"
  OTEL_SDK_DISABLED: "false"
