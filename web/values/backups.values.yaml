fullnameOverride: backups

image:
  repository: ghcr.io/fab-infra/backuptools
  tag:  opensuse16-20260728-1847-563bf6e

podSecurityContext:
  runAsUser: 1003
  runAsGroup: 1004

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

backends:
  gcs:
    bucket: crespel-me-backups
  s3:
    provider: OVH
    region: rbx
    bucket: crespel-me-backups
  swift:
    container: backups

backups:
  files:
    backends: swift,gcs
  ldap:
    backends: s3,gcs
  mysql:
    backends: s3,gcs
    host: mysql-slave
  sync:
    backends: s3,gcs
    args: |
      s3:crespel-me-nextcloud gcs:crespel-me-nextcloud --checksum

schedules:
  files: "15 4 * * *"
  ldap: "0 4 * * *"
  mysql: "0 4 * * *"
  sync: "30 4 * * *"

volumes:
  domain:
    hostPath:
      path: /home/domains/crespel.me
      type: DirectoryOrCreate
  ldap:
    hostPath:
      path: /home/domains/crespel.me/ldap
      type: DirectoryOrCreate
