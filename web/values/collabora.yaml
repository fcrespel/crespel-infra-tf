fullnameOverride: collabora

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/default-backend: default-backend
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_WOPISrc"
  hosts:
    - host: "collabora.crespel.me"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: collabora-tls
      hosts:
        - "collabora.crespel.me"

autoscaling:
  enabled: false

collabora:
  aliasgroups:
    - host: "https://cloud.crespel.me:443"
  extra_params: >
    --o:ssl.enable=false
    --o:ssl.termination=true
  server_name: "collabora.crespel.me"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

serviceAccount:
  create: true
