fullnameOverride: nexus

podSecurityContext:
  runAsUser: 1003
  runAsGroup: 1004

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/default-backend: default-backend
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
  hosts:
    - host: "services.crespel.me"
      paths:
        - path: "/nexus"
          pathType: ImplementationSpecific
    - host: "docker.crespel.me"
      paths:
        - path: "/"
          pathType: ImplementationSpecific
          servicePort: 5000
  tls:
    - secretName: apache-tls
      hosts:
        - "docker.crespel.me"
        - "services.crespel.me"

env:
  NEXUS_CONTEXT: nexus

volumes:
  data:
    hostPath:
      path: /home/domains/crespel.me/apps/nexus
      type: DirectoryOrCreate
