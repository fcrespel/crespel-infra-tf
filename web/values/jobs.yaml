fullnameOverride: jobs

podSecurityContext:
  runAsUser: 1003
  runAsGroup: 1004

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

schedules:
  nextcloud-cron: "3-59/5 * * * *"
  nextcloud-preview-generate: "17 2 * * *"
  piwik-archive: "7 * * * *"

volumes:
  apps:
    hostPath:
      path: /home/domains/crespel.me/apps
      type: DirectoryOrCreate
