fullnameOverride: commandcentral

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/default-backend: default-backend
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: "services.crespel.me"
      paths:
        - path: "/cce"
          pathType: ImplementationSpecific
          servicePort: 8091
        - path: "/products-.*"
          pathType: ImplementationSpecific
          servicePort: 8993
        - path: "/fix-.*"
          pathType: ImplementationSpecific
          servicePort: 8993
  tls:
    - secretName: apache-tls
      hosts:
        - "services.crespel.me"

volumes:
  cce:
    conf:
      hostPath:
        path: /home/domains/crespel.me/sag/CCE/configuration
        type: DirectoryOrCreate
    data:
      hostPath:
        path: /home/domains/crespel.me/sag/CCE/data
        type: DirectoryOrCreate
  spm:
    conf:
      hostPath:
        path: /home/domains/crespel.me/sag/SPM/configuration
        type: DirectoryOrCreate
    data:
      hostPath:
        path: /home/domains/crespel.me/sag/SPM/data
        type: DirectoryOrCreate
