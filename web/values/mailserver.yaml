fullnameOverride: mailserver

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

env:
  FROM_HEADER: crespel.me
  POSTFIX_MYHOSTNAME: sy03.srv.fabinfra.net
  POSTFIX_MYNETWORKS: 127.0.0.0/8,10.244.0.0/16

volumes:
  postfix:
    hostPath:
      path: /home/domains/crespel.me/mailserver/postfix
      type: DirectoryOrCreate

dkim:
  enabled: true
  config:
    domain: crespel.me
    selector: march2016
    internalHosts: 127.0.0.0/8,10.244.0.0/16
