fullnameOverride: matomo

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/default-backend: default-backend
  hosts:
    - host: "services.crespel.me"
      paths:
        - path: /piwik
          pathType: Prefix
  tls:
    - secretName: apache-tls
      hosts:
        - "services.crespel.me"

cron:
  schedule: "7 * * * *"

config:
  apache: |
    Alias /piwik /var/www/html
  matomo:
    database:
      host: mysql
      dbname: crespel-piwik
      tables_prefix: piwik_
      schema: Myisam
      charset: utf8mb4
    General:
      assume_secure_protocol: 1
      force_ssl: 1
      proxy_client_headers: ["HTTP_X_FORWARDED_FOR"]
      proxy_host_headers: ["HTTP_X_FORWARDED_HOST"]
      trusted_hosts: ["services.crespel.me"]
    Tracker:
      ignore_visits_cookie_name: piwik_ignore
    mail:
      transport: smtp
      port: 587
      host: mailserver

volumes:
  misc:
    hostPath:
      path: /home/domains/crespel.me/apps/matomo/misc
      type: DirectoryOrCreate
  tmp:
    hostPath:
      path: /home/domains/crespel.me/apps/matomo/tmp
      type: DirectoryOrCreate
