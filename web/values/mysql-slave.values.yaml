fullnameOverride: mysql-slave

image:
  repository: docker.io/mariadb
  tag: "12.3.2"

podSecurityContext:
  runAsUser: 1003
  runAsGroup: 1004

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

config:
  slave.cnf: |
    [mysqld]
    binlog_format = mixed
    expire_logs_days = 7
    log-bin = mysql-bin
    max_allowed_packet = 67108864
    relay-log = relay-bin
    relay-log-index = relay-bin.index
    server-id = 2
    read-only

volumes:
  data:
    hostPath:
      path: /home/domains/crespel.me/mysql-slave
      type: DirectoryOrCreate
