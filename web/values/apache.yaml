fullnameOverride: apache

podSecurityContext:
  runAsUser: 1003
  runAsGroup: 1004

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 300m
  hosts:
    - host: "fabien.crespel.me"
      paths:
        - path: "/"
          pathType: ImplementationSpecific
    - host: "files.crespel.me"
      paths:
        - path: "/"
          pathType: ImplementationSpecific
    - host: "services.crespel.me"
      paths:
        - path: "/"
          pathType: ImplementationSpecific
  tls:
    - secretName: apache-tls
      hosts:
        - "docker.crespel.me"
        - "fabien.crespel.me"
        - "files.crespel.me"
        - "services.crespel.me"

env:
  SERVER_ENV: production
  SERVER_NAME: srv01.crespel.me

volumes:
  logs:
    hostPath:
      path: /home/domains/crespel.me/httpd/logs
      type: DirectoryOrCreate
  apps:
    hostPath:
      path: /home/domains/crespel.me/apps
      type: DirectoryOrCreate
  subdomains:
    hostPath:
      path: /home/domains/crespel.me/sd
      type: DirectoryOrCreate

vhosts:
  vhost.inc: |
    ServerAdmin webmaster@crespel.me
    Include /etc/apache2/mod_autoindex-defaults-oxygen.conf
    IncludeOptional /etc/apache2/vhosts.d/common?inc
  _default_.conf: |
    <VirtualHost _default_:8080>
      ServerName crespel.me
      DocumentRoot /srv/www/sd/www/htdocs/
      Redirect permanent / https://www.crespel.me/
      ErrorLog /srv/www/sd/www/logs/error_log
      CustomLog /srv/www/sd/www/logs/access_log combined
      Include /etc/apache2/vhosts.d/vhost.inc
    </VirtualHost>
  fabien.conf: |
    <VirtualHost _default_:8080>
      ServerName fabien.crespel.me
      DocumentRoot /srv/www/sd/fabien/htdocs/
      ErrorLog /srv/www/sd/fabien/logs/error_log
      CustomLog /srv/www/sd/fabien/logs/access_log combined
      Include /etc/apache2/vhosts.d/vhost.inc
    </VirtualHost>
  files.conf: |
    <VirtualHost _default_:8080>
      ServerName files.crespel.me
      DocumentRoot /srv/www/sd/files/htdocs/
      ErrorLog /srv/www/sd/files/logs/error_log
      CustomLog /srv/www/sd/files/logs/access_log combined
      Include /etc/apache2/vhosts.d/vhost.inc
    </VirtualHost>
  services.conf: |
    <VirtualHost _default_:8080>
      ServerName services.crespel.me
      DocumentRoot /srv/www/sd/services/htdocs/
      ErrorLog /srv/www/sd/services/logs/error_log
      CustomLog /srv/www/sd/services/logs/access_log combined
      Include /etc/apache2/vhosts.d/vhost.inc
    </VirtualHost>
