fullnameOverride: nextcloud

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/default-backend: default-backend
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
  hosts:
    - host: "cloud.crespel.me"
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: nextcloud-tls
      hosts:
        - "cloud.crespel.me"

env:
  MAIL_DOMAIN: crespel.me
  MAIL_FROM_ADDRESS: nextcloud
  MYSQL_DATABASE: crespel-nextcloud
  MYSQL_HOST: mysql
  NEXTCLOUD_TRUSTED_DOMAINS: cloud.crespel.me
  OBJECTSTORE_S3_AUTOCREATE: 'false'
  OBJECTSTORE_S3_BUCKET: crespel-me-nextcloud
  OBJECTSTORE_S3_HOST: s3.rbx.io.cloud.ovh.net
  OBJECTSTORE_S3_PORT: 443
  OBJECTSTORE_S3_REGION: rbx
  OBJECTSTORE_S3_SSL: 'true'
  OVERWRITECLIURL: https://cloud.crespel.me
  OVERWRITEPROTOCOL: https
  PHP_MEMORY_LIMIT: 2G
  PHP_UPLOAD_LIMIT: 2G
  REDIS_HOST: redis
  SMTP_HOST: mailserver
  SMTP_PORT: 587
  TRUSTED_PROXIES: 172.17.0.0/16 10.244.0.0/16 127.0.0.0/8 ::1

cron:
  schedule: "3-59/5 * * * *"

notify_push:
  enabled: true

volumes:
  config:
    hostPath:
      path: /home/domains/crespel.me/apps/nextcloud/config
      type: DirectoryOrCreate
  customapps:
    hostPath:
      path: /home/domains/crespel.me/apps/nextcloud/custom_apps
      type: DirectoryOrCreate
  data:
    hostPath:
      path: /home/domains/crespel.me/apps/nextcloud/data
      type: DirectoryOrCreate
  www:
    hostPath:
      path: /home/domains/crespel.me/apps/nextcloud/www
      type: DirectoryOrCreate
