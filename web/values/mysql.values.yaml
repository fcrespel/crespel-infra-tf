fullnameOverride: mysql

image:
  repository: docker.io/mariadb
  tag: "11.8.5"

podSecurityContext:
  runAsUser: 1003
  runAsGroup: 1004

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

config:
  master.cnf: |
    [mysqld]
    binlog_format = mixed
    expire_logs_days = 7
    log-bin = mysql-bin
    max_allowed_packet = 67108864
    server-id = 1

volumes:
  data:
    hostPath:
      path: /home/domains/crespel.me/mysql
      type: DirectoryOrCreate
