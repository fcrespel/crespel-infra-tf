fullnameOverride: phpmyadmin

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/default-backend: nginx-errors
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: "services.crespel.me"
      paths:
        - path: "/phpMyAdmin(/|$)(.*)"
          pathType: ImplementationSpecific
  tls:
    - secretName: apache-tls
      hosts:
        - "services.crespel.me"

env:
  PMA_HOST: mysql
  PMA_PORT: 3306
  PMA_ABSOLUTE_URI: https://services.crespel.me/phpMyAdmin/
