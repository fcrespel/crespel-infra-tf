fullnameOverride: wordpress

nodeSelector:
  server-role-web: "true"
  domain-crespel-me: "true"

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/default-backend: default-backend
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  hosts:
    - host: "crespel.me"
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: "blog.crespel.me"
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: "blogs.crespel.me"
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: "www.crespel.me"
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: wordpress-tls
      hosts:
        - "crespel.me"
        - "blog.crespel.me"
        - "blogs.crespel.me"
        - "www.crespel.me"

env:
  WORDPRESS_DB_HOST: mysql
  WORDPRESS_DB_NAME: crespel-blogs
  WORDPRESS_CONFIG_EXTRA: |
    /* Additional wp-config.php settings */
    define( 'DISABLE_WP_CRON', true );
    define( 'WP_AUTO_UPDATE_CORE', false );
    /* Redis Object Cache */
    define( 'WP_REDIS_HOST', 'redis' );
    define( 'WP_REDIS_DATABASE', 1 );
    /* Advanced Media Offloader */
    define( 'ADVMO_DOS_KEY', getenv_docker('ADVMO_DOS_KEY', '') );
    define( 'ADVMO_DOS_SECRET', getenv_docker('ADVMO_DOS_SECRET', '') );
    define( 'ADVMO_DOS_ENDPOINT', 'https://s3.rbx.io.cloud.ovh.net' );
    define( 'ADVMO_DOS_REGION', 'rbx');
    define( 'ADVMO_DOS_BUCKET', 'crespel-me-blogs' );
    define( 'ADVMO_DOS_DOMAIN', 'https://crespel-me-blogs.s3.rbx.io.cloud.ovh.net' );
    /* WPMU */
    define( 'WP_ALLOW_MULTISITE', true );
    define( 'MULTISITE', true );
    define( 'SUBDOMAIN_INSTALL', false );
    define( 'DOMAIN_CURRENT_SITE', 'blogs.crespel.me' );
    define( 'PATH_CURRENT_SITE', '/' );
    define( 'SITE_ID_CURRENT_SITE', 1 );
    define( 'BLOG_ID_CURRENT_SITE', 1 );

config:
  multisite: true
  php:
    max_execution_time: 300
    max_input_time: 300
    memory_limit: 128M
    post_max_size: 128M
    upload_max_filesize: 100M

cron:
  enabled: true

volumes:
  content:
    hostPath:
      path: /home/domains/crespel.me/apps/wordpress/wp-content
      type: DirectoryOrCreate
